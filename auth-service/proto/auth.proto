syntax = "proto3";

package auth;

option go_package = "auth-service/gen;gen";

service AuthService {
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenResponse);
}

message VerifyTokenRequest {
  string token = 1;
}

message VerifyTokenResponse {
  bool valid = 1;
  int64 user_id = 2;  // Исправлено: было user_id = 1, должно быть = 2
}